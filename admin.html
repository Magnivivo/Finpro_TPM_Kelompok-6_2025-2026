<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Hackathon</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">HACKATHON</div>
        <nav class="nav-menu">
            <a href="#">Home</a>
            <a href="#">Mentor & Jury</a>
            <a href="#">Champion Prizes</a>
            <a href="#">About</a>
            <a href="#">Timeline</a>
            <a href="#">FAQ</a>
        </nav>
        <button class="login-btn-header">
            Login
            <span class="dropdown-icon">▼</span>
        </button>
    </header>

    <div class="container">
        <!-- Main Content -->
        <main class="main-content">
            <h1 class="page-title">Participant List</h1>

            <!-- Search and Sort Bar -->
            <div class="control-bar">
                <div class="search-box">
                    <svg class="search-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M21 21L15 15M17 10C17 13.866 13.866 17 10 17C6.13401 17 3 13.866 3 10C3 6.13401 6.13401 3 10 3C13.866 3 17 6.13401 17 10Z" stroke="white" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search Team Name..." oninput="searchTeams()">
                </div>
                
                <div class="sort-section">
                    <label>Sort by</label>
                    <div class="sort-dropdown">
                        <button class="sort-btn" onclick="toggleSortDropdown()">
                            <span id="currentSort">Name A-Z</span>
                            <span class="dropdown-icon">▼</span>
                        </button>
                        <div class="sort-options" id="sortOptions">
                            <div class="sort-option" onclick="sortTeams('name-az')">Name A-Z</div>
                            <div class="sort-option" onclick="sortTeams('name-za')">Name Z-A</div>
                            <div class="sort-option" onclick="sortTeams('newest')">Newest to Oldest</div>
                            <div class="sort-option" onclick="sortTeams('oldest')">Oldest to Newest</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Participants Table -->
            <div class="participants-card">
                <h2 class="card-title">Nama Tim</h2>
                <div class="participants-list" id="participantsList">
                    <!-- Team items will be inserted here by JavaScript -->
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons" id="actionButtons" style="display: none;">
                <button class="action-btn view-btn" onclick="viewTeamDetails()">View</button>
                <button class="action-btn edit-btn" onclick="editTeam()">Edit</button>
                <button class="action-btn delete-btn" onclick="deleteTeam()">Delete</button>
            </div>
        </main>
    </div>

    <!-- View Team Modal -->
    <div id="viewModal" class="modal">
        <div class="modal-content wide">
            <button class="modal-close" onclick="closeViewModal()">×</button>
            <h2>Team Details</h2>
            <div id="teamDetailsContent"></div>
        </div>
    </div>

    <!-- Edit Team Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content wide">
            <button class="modal-close" onclick="closeEditModal()">×</button>
            <h2>Edit Team</h2>
            <div id="editFormContent"></div>
            <div class="modal-buttons">
                <button class="modal-btn save" onclick="saveTeamChanges()">Save Changes</button>
                <button class="modal-btn cancel" onclick="closeEditModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeDeleteModal()">×</button>
            <h2>Confirm Delete</h2>
            <p style="color: #fff; margin: 2rem 0;">Are you sure you want to delete this team? This action cannot be undone.</p>
            <div class="modal-buttons">
                <button class="modal-btn confirm" onclick="confirmDelete()">Yes, Delete</button>
                <button class="modal-btn cancel" onclick="closeDeleteModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
